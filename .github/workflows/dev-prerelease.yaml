---
name: Dev pre-release

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  prerelease:
    name: 🚧 Create dev pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: ⤵️ Checkout
        uses: actions/checkout@v7.0.1

      - name: 🧹 Keep only the last 5 dev pre-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Keep the 4 most recent existing dev pre-releases so that,
          # together with the one this run is about to create, there are
          # 5 in total. Explicitly sorts by publishedAt (newest first)
          # rather than relying on gh's default ordering.
          gh release list --limit 100 --json tagName,isPrerelease,publishedAt \
            --jq '[.[] | select(.isPrerelease) | select(.tagName | startswith("v0.0.0-dev."))]
                  | sort_by(.publishedAt) | reverse | .[4:] | .[].tagName' \
          | while read -r tag; do
              echo "Deleting old dev pre-release (beyond the 5 most recent): ${tag}"
              gh release delete "${tag}" --yes --cleanup-tag
            done

      - name: 🔢 Determine pre-release version
        id: version
        run: |
          echo "version=v0.0.0-dev.$(date -u +%Y%m%d%H%M).$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 🔢 Adjust version number
        run: |
          sed -i 's/v0.0.0/${{ steps.version.outputs.version }}/' custom_components/victron/manifest.json

      - name: 📦 Create zipped release package
        shell: bash
        run: |
          cd "${{ github.workspace }}/custom_components/victron"
          zip victron.zip ./* -x '.*'

      - name: 🔏 Sign release package
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: ${{ github.workspace }}/custom_components/victron/victron.zip
          # No release exists yet at this point in the job (we're on a push
          # trigger, not a release trigger like build.yaml), so let the
          # softprops step below attach the assets instead of having this
          # action try to find/upload to a release itself.
          release-signing-artifacts: false

      - name: 🚧 Create pre-release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Dev build ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/custom_components/victron/victron.zip
            ${{ github.workspace }}/custom_components/victron/victron.zip.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
