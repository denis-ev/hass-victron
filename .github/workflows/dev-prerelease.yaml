---
name: Dev pre-release

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  prerelease:
    name: 🚧 Create dev pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⤵️ Checkout
        uses: actions/checkout@v7.0.1

      - name: 🧹 Delete previous dev pre-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | select(.tagName | startswith("v0.0.0-dev.")) | .tagName' \
          | while read -r tag; do
              echo "Deleting previous dev pre-release: ${tag}"
              gh release delete "${tag}" --yes --cleanup-tag
            done

      - name: 🔢 Determine pre-release version
        id: version
        run: |
          echo "version=v0.0.0-dev.$(date -u +%Y%m%d%H%M).$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 🚧 Create pre-release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Dev build ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
